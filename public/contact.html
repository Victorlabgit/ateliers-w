<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Ateliers W</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="entete" style="position:static;background:#1a1a1a"><div class="wrap"><a class="logo" href="index.html">Ateliers W</a></div></header>
<main class="section contact">
  <div class="wrap">
    <h2>Demandez un devis</h2>
    <form action="https://formspree.io/f/VOTRE_ID" method="POST" style="max-width:36rem">
      <div><label for="nom">Nom</label><input id="nom" name="nom" type="text" required autocomplete="name"></div>
      <div><label for="email">E-mail*</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <div><label for="tel">Téléphone</label><input id="tel" name="telephone" type="tel" autocomplete="tel"></div>
      <div><label for="message">Message</label><textarea id="message" name="message" required></textarea></div>
      <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div><button class="btn" type="submit">Envoyer</button></div>
      <p class="retour" role="status" aria-live="polite"></p>
    </form>
  </div>
</main>
<footer class="pied"><div class="wrap"><p><a href="index.html">Retour à l'accueil</a></p><p>© 2026 by Ateliers W</p></div></footer>
<script src="js/main.js"></script>
</body>
</html>
