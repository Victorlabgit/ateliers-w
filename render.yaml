services:
  - type: web
    name: ateliers-w
    runtime: static
    buildCommand: echo "Site statique, pas de build"
    staticPublishPath: ./public
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
